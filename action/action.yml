name: TraceFact Agent Reliability
description: Analyze an agent trace and publish evidence-linked Markdown and SARIF artifacts.
author: TraceFact contributors
branding: { icon: activity, color: green }
inputs:
  trace:
    description: Path to a Codex, Gemini CLI, Browser Use, JSONL, OTel, or OATS trace.
    required: true
  adapter:
    description: Adapter ID or auto.
    default: auto
  fail-on:
    description: none, error, or warning.
    default: error
outputs:
  report:
    description: Path to report.json.
    value: ${{ steps.analyze.outputs.report }}
runs:
  using: composite
  steps:
    - shell: bash
      run: npm install --no-audit --no-fund && npm run build
      working-directory: ${{ github.action_path }}/..
    - id: analyze
      shell: bash
      run: |
        node "${{ github.action_path }}/../dist/cli.js" analyze "${{ inputs.trace }}" --adapter "${{ inputs.adapter }}" --out "$RUNNER_TEMP/tracefact"
        echo "report=$RUNNER_TEMP/tracefact/report.json" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/tracefact/report.md" >> "$GITHUB_STEP_SUMMARY"
    - if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        TRACEFACT_SUMMARY: ${{ runner.temp }}/tracefact/report.md
      with:
        github-token: ${{ github.token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- tracefact-report -->';
          const body = `${marker}\n${fs.readFileSync(process.env.TRACEFACT_SUMMARY, 'utf8')}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const prior = comments.find(c => c.body?.includes(marker) && c.user?.type === 'Bot');
          if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - uses: actions/upload-artifact@v4
      with:
        name: tracefact-report
        path: ${{ runner.temp }}/tracefact
    - if: inputs.fail-on != 'none'
      shell: bash
      run: |
        node -e "const r=require(process.argv[1]);const level=process.argv[2];const bad=r.findings.some(f=>f.severity==='error'||(level==='warning'&&f.severity==='warning'));if(bad)process.exit(1)" "$RUNNER_TEMP/tracefact/report.json" "${{ inputs.fail-on }}"
